[env:esp32dev]
platform       = espressif32
board          = esp32dev
framework      = arduino
monitor_speed  = 115200
#upload_speed   = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -Wall
    -Wextra
    -I include

build_src_filter =
    +<*>
    +<sensor/*>
    +<net/*>
    +<cloud/*>

lib_deps =
    #olikraus/U8g2@^2.35.30
    bblanchon/ArduinoJson@^7.0.4
    knolleary/PubSubClient@^2.8.0
    claws/BH1750@^1.3.0

check_tool  = cppcheck
check_flags = --enable=all --suppress=missingInclude
